<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0f; }
      .text { fill: #e5e7eb; }
      .text-dim { fill: #6b7280; }
      .text-accent { fill: #60a5fa; }
      .line { stroke: #1a1a2e; }
      .line-accent { stroke: #3b82f6; }
      .node { fill: #111118; stroke: #1a1a2e; }
      .node-active { fill: #111118; stroke: #3b82f6; }
      .node-current { fill: #3b82f6; stroke: #60a5fa; }
      .dot { fill: #3b82f6; }
      .arrow { fill: #3b82f6; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fafafa; }
      .text { fill: #1f2937; }
      .text-dim { fill: #9ca3af; }
      .text-accent { fill: #2563eb; }
      .line { stroke: #e5e7eb; }
      .line-accent { stroke: #2563eb; }
      .node { fill: #ffffff; stroke: #e5e7eb; }
      .node-active { fill: #ffffff; stroke: #2563eb; }
      .node-current { fill: #2563eb; stroke: #3b82f6; }
      .dot { fill: #2563eb; }
      .arrow { fill: #2563eb; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }
    .title { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; }
    .node-text { font-size: 9px; font-weight: 600; }
    .node-sub { font-size: 8px; }
    .label { font-size: 8px; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }
  </style>

  <rect width="500" height="200" class="bg"/>

  <!-- Title -->
  <text x="250" y="22" text-anchor="middle" class="title text">ENGINEERING DIRECTION</text>
  <text x="250" y="36" text-anchor="middle" class="node-sub text-dim">Where I am heading</text>

  <!-- Path line -->
  <path d="M60 100 L440 100" class="line" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Node 1: Foundations -->
  <g transform="translate(30, 70)">
    <rect width="70" height="60" rx="4" class="node" stroke-width="1"/>
    <circle cx="35" cy="20" r="8" fill="none" class="line-accent" stroke-width="1"/>
    <text x="35" y="23" text-anchor="middle" class="node-text text" font-size="10">{}</text>
    <text x="35" y="42" text-anchor="middle" class="node-text text">FOUNDATIONS</text>
    <text x="35" y="52" text-anchor="middle" class="node-sub text-dim">Python · JS</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M105 100 L120 95 L120 105 Z" class="arrow" opacity="0.6"/>

  <!-- Node 2: Full-Stack -->
  <g transform="translate(130, 70)">
    <rect width="70" height="60" rx="4" class="node" stroke-width="1"/>
    <circle cx="35" cy="20" r="8" fill="none" class="line-accent" stroke-width="1"/>
    <text x="35" y="23" text-anchor="middle" class="node-text text" font-size="10">&lt;/&gt;</text>
    <text x="35" y="42" text-anchor="middle" class="node-text text">FULL-STACK</text>
    <text x="35" y="52" text-anchor="middle" class="node-sub text-dim">React · FastAPI</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M205 100 L220 95 L220 105 Z" class="arrow" opacity="0.6"/>

  <!-- Node 3: AI Systems (current) -->
  <g transform="translate(230, 70)">
    <rect width="70" height="60" rx="4" class="node-current" stroke-width="1.5"/>
    <circle cx="35" cy="20" r="8" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="35" y="23" text-anchor="middle" class="node-text" font-size="10" fill="#ffffff">AI</text>
    <text x="35" y="42" text-anchor="middle" class="node-text" fill="#ffffff">AI SYSTEMS</text>
    <text x="35" y="52" text-anchor="middle" class="node-sub" fill="#bfdbfe">Gemini · Rules</text>
    <!-- Current indicator -->
    <circle cx="35" cy="-5" r="3" class="dot"/>
    <text x="35" y="-10" text-anchor="middle" class="label text-accent">NOW</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M305 100 L320 95 L320 105 Z" class="arrow" opacity="0.6"/>

  <!-- Node 4: Systems -->
  <g transform="translate(330, 70)">
    <rect width="70" height="60" rx="4" class="node-active" stroke-width="1"/>
    <circle cx="35" cy="20" r="8" fill="none" class="line-accent" stroke-width="1.5"/>
    <text x="35" y="23" text-anchor="middle" class="node-text text-accent" font-size="10">⚙</text>
    <text x="35" y="42" text-anchor="middle" class="node-text text">SYSTEMS</text>
    <text x="35" y="52" text-anchor="middle" class="node-sub text-dim">Architecture</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M405 100 L420 95 L420 105 Z" class="arrow" opacity="0.6"/>

  <!-- Node 5: Automation -->
  <g transform="translate(430, 70)">
    <rect width="50" height="60" rx="4" class="node" stroke-width="1"/>
    <circle cx="25" cy="20" r="8" fill="none" class="line-accent" stroke-width="1"/>
    <text x="25" y="23" text-anchor="middle" class="node-text text" font-size="10">→</text>
    <text x="25" y="42" text-anchor="middle" class="node-text text">AUTO</text>
    <text x="25" y="52" text-anchor="middle" class="node-sub text-dim">Next</text>
  </g>

  <!-- Direction labels -->
  <text x="250" y="155" text-anchor="middle" class="label text-dim">Programming → Software → Full-Stack → AI → Systems → Automation</text>
  <text x="250" y="170" text-anchor="middle" class="label text-dim">Each stage builds on the previous. No shortcuts.</text>

  <!-- Progress indicator -->
  <rect x="100" y="185" width="300" height="3" rx="1.5" fill="#1a1a2e"/>
  <rect x="100" y="185" width="190" height="3" rx="1.5" class="dot" opacity="0.7"/>

</svg>
