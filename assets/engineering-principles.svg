<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .t { font-size: 13px; font-weight: 600; fill: #1f2937; letter-spacing: 0.5px; }
    .st { font-size: 10px; fill: #6b7280; }
    .n { font-size: 22px; font-weight: 700; fill: #2563eb; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }
    .p { font-size: 12px; font-weight: 600; fill: #1f2937; }
    .d { font-size: 10px; fill: #6b7280; }
    .s { font-size: 9px; fill: #9ca3af; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }
    .c { stroke: #e5e7eb; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e5e7eb; }
      .st { fill: #9ca3af; }
      .n { fill: #60a5fa; }
      .p { fill: #e5e7eb; }
      .d { fill: #9ca3af; }
      .s { fill: #6b7280; }
      .c { stroke: #374151; }
    }
  </style>

  <text x="350" y="24" text-anchor="middle" class="t">ENGINEERING PRINCIPLES</text>
  <text x="350" y="40" text-anchor="middle" class="st">Patterns enforced across repositories</text>

  <line x1="40" y1="60" x2="660" y2="60" class="c"/>
  <text x="55" y="88" class="n">01</text>
  <text x="95" y="88" class="p">SECURITY BOUNDARIES</text>
  <text x="95" y="106" class="d">Database-enforced isolation and role controls</text>
  <text x="95" y="124" class="s">Civic-eye: Supabase RLS — no custom backend</text>

  <line x1="40" y1="150" x2="660" y2="150" class="c"/>
  <text x="55" y="178" class="n">02</text>
  <text x="95" y="178" class="p">HUMAN VERIFICATION</text>
  <text x="95" y="196" class="d">AI assists extraction; verification remains explicit</text>
  <text x="95" y="214" class="s">IMNCI-Safe: LLM → clinician → deterministic rules</text>

  <line x1="40" y1="240" x2="660" y2="240" class="c"/>
  <text x="55" y="268" class="n">03</text>
  <text x="95" y="268" class="p">DETERMINISTIC LOGIC</text>
  <text x="95" y="286" class="d">Safety-critical classification uses deterministic rules</text>
  <text x="95" y="304" class="s">IMNCI-Safe: same input → same output, always</text>

  <line x1="40" y1="330" x2="660" y2="330" class="c"/>
  <text x="55" y="358" class="n">04</text>
  <text x="95" y="358" class="p">EVIDENCE &amp; TRACEABILITY</text>
  <text x="95" y="376" class="d">Workflows connect actions and outcomes to observable evidence</text>
  <text x="95" y="394" class="s">Civic-eye &amp; CIRCUVA: photo evidence, verification loops</text>

</svg>
