<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .lp { font-size: 12px; font-weight: 600; fill: #1f2937; }
    .ls { font-size: 10px; fill: #6b7280; }
    .la { font-size: 10px; font-weight: 600; fill: #2563eb; }
    .ln { font-size: 9px; fill: #6b7280; }
    .c { stroke: #d1d5db; stroke-width: 1; }
    .ca { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4 2; }
    @media (prefers-color-scheme: dark) {
      .lp { fill: #e5e7eb; }
      .ls { fill: #9ca3af; }
      .la { fill: #60a5fa; }
      .ln { fill: #6b7280; }
      .c { stroke: #374151; }
      .ca { stroke: #60a5fa; }
    }
  </style>

  <text x="400" y="22" text-anchor="middle" class="lp" font-size="13" letter-spacing="1">SYSTEMS MAP</text>

  <circle cx="400" cy="75" r="26" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="72" text-anchor="middle" class="lp" font-size="11">ADIB</text>
  <text x="400" y="85" text-anchor="middle" class="la" font-size="8">Systems Builder</text>

  <line x1="400" y1="101" x2="400" y2="163" class="c"/>

  <rect x="110" y="165" width="200" height="140" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="210" y="187" text-anchor="middle" class="lp" font-size="11">IMNCI-Safe</text>
  <text x="210" y="202" text-anchor="middle" class="ls">Responsible AI</text>
  <line x1="140" y1="215" x2="280" y2="215" stroke="#e5e7eb" stroke-width="1"/>
  <text x="210" y="232" text-anchor="middle" class="la">Deterministic rules</text>
  <text x="210" y="248" text-anchor="middle" class="ln">LLM extracts, rules decide</text>
  <text x="210" y="268" text-anchor="middle" class="ln">245 tests</text>
  <text x="210" y="284" text-anchor="middle" class="ln">UNKNOWN invariant</text>

  <rect x="300" y="165" width="200" height="140" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="400" y="187" text-anchor="middle" class="lp" font-size="11">Civic-eye</text>
  <text x="400" y="202" text-anchor="middle" class="ls">Civic Operations</text>
  <line x1="330" y1="215" x2="470" y2="215" stroke="#e5e7eb" stroke-width="1"/>
  <text x="400" y="232" text-anchor="middle" class="la">RLS / multi-tenant</text>
  <text x="400" y="248" text-anchor="middle" class="ln">Database-enforced access</text>
  <text x="400" y="268" text-anchor="middle" class="ln">4 roles, no custom backend</text>
  <text x="400" y="284" text-anchor="middle" class="ln">Live demo</text>

  <rect x="490" y="165" width="200" height="140" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="590" y="187" text-anchor="middle" class="lp" font-size="11">CIRCUVA</text>
  <text x="590" y="202" text-anchor="middle" class="ls">Campus Operations</text>
  <line x1="520" y1="215" x2="660" y2="215" stroke="#e5e7eb" stroke-width="1"/>
  <text x="590" y="232" text-anchor="middle" class="la">Verification workflows</text>
  <text x="590" y="248" text-anchor="middle" class="ln">Closed-loop report pipeline</text>
  <text x="590" y="268" text-anchor="middle" class="ln">66 tests, JWT/RBAC</text>
  <text x="590" y="284" text-anchor="middle" class="ln">Custom SVG rendering</text>

  <line x1="210" y1="163" x2="210" y2="165" class="ca"/>
  <line x1="400" y1="163" x2="400" y2="165" class="ca"/>
  <line x1="590" y1="163" x2="590" y2="165" class="ca"/>

  <line x1="400" y1="305" x2="400" y2="340" class="c"/>

  <rect x="270" y="340" width="260" height="60" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="400" y="362" text-anchor="middle" class="lp" font-size="11">Jervis</text>
  <text x="400" y="377" text-anchor="middle" class="ls">Local AI</text>
  <text x="400" y="392" text-anchor="middle" class="ln">On-device autonomy · Voice + LLM + SQLite</text>

  <text x="400" y="418" text-anchor="middle" class="ls" font-size="9">Each project enforces constraints at the architecture level</text>

</svg>
